name: Release Shudder

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup native Linux build
        uses: ./.github/actions/setup-native-linux
        with:
          additional-system-packages: streamlink mpv weston desktop-file-utils appstream rpm file patchelf

      - name: Setup AppImage tools
        uses: ./.github/actions/setup-appimage-tools

      - name: Validate tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -qx "  VERSION $version" CMakeLists.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "SHUDDER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DSHUDDER_GITHUB_OWNER=fosschad \
            -DSHUDDER_GITHUB_REPOSITORY=Shudder

      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: QML lint
        run: cmake --build build --target all_qmllint

      - name: Validate desktop metadata
        run: |
          desktop-file-validate build/packaging/*.desktop
          appstreamcli validate --no-net build/packaging/*.metainfo.xml

      - name: Package
        run: cmake --build build --target package

      - name: Build versioned AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/appimage/build-appimage.sh build

      - name: Verify release artifacts
        run: |
          expected=(
            "build/shudder_${SHUDDER_VERSION}_x86_64.tar.gz"
            "build/shudder_${SHUDDER_VERSION}_amd64.deb"
            "build/shudder-${SHUDDER_VERSION}-1.x86_64.rpm"
            "Shudder-${SHUDDER_VERSION}-x86_64.AppImage"
            "Shudder-${SHUDDER_VERSION}-x86_64.AppImage.sha256"
          )
          for artifact in "${expected[@]}"; do
            test -s "$artifact"
          done
          packaging/appimage/verify-appimage.sh "Shudder-${SHUDDER_VERSION}-x86_64.AppImage"

      - name: AppImage Wayland smoke test
        run: |
          runtime_dir="$(mktemp -d)"
          chmod 700 "$runtime_dir"
          XDG_RUNTIME_DIR="$runtime_dir" weston --backend=headless-backend.so --socket=wayland-shudder-appimage --idle-time=0 >"$runtime_dir/weston.log" 2>&1 &
          weston_pid=$!

          cleanup() {
            kill "$weston_pid" 2>/dev/null || true
            wait "$weston_pid" 2>/dev/null || true
            cat "$runtime_dir/weston.log" || true
            rm -rf "$runtime_dir"
          }

          trap cleanup EXIT
          sleep 2

          set +e
          env \
            DISPLAY= \
            XDG_RUNTIME_DIR="$runtime_dir" \
            WAYLAND_DISPLAY=wayland-shudder-appimage \
            QT_QPA_PLATFORM=wayland \
            timeout 15s "./Shudder-${SHUDDER_VERSION}-x86_64.AppImage" --appimage-extract-and-run
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 124 ]; then
            exit "$exit_code"
          fi

      - name: Prepare release payload
        run: |
          mkdir -p release
          cp \
            "build/shudder_${SHUDDER_VERSION}_x86_64.tar.gz" \
            "build/shudder_${SHUDDER_VERSION}_amd64.deb" \
            "build/shudder-${SHUDDER_VERSION}-1.x86_64.rpm" \
            "Shudder-${SHUDDER_VERSION}-x86_64.AppImage" \
            "Shudder-${SHUDDER_VERSION}-x86_64.AppImage.sha256" \
            release/
          cp CHANGELOG.md release/release-notes.md
          (
            cd release
            sha256sum \
              "shudder_${SHUDDER_VERSION}_x86_64.tar.gz" \
              "shudder_${SHUDDER_VERSION}_amd64.deb" \
              "shudder-${SHUDDER_VERSION}-1.x86_64.rpm" \
              "Shudder-${SHUDDER_VERSION}-x86_64.AppImage" \
              "Shudder-${SHUDDER_VERSION}-x86_64.AppImage.sha256" \
              > SHA256SUMS
          )

      - name: Upload release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shudder-linux-release
          if-no-files-found: error
          retention-days: 2
          path: release/*

  sanitizers:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup native Linux build
        uses: ./.github/actions/setup-native-linux

      - name: Configure ASan UBSan
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DSHUDDER_ENABLE_SANITIZERS=ON \
            -DSHUDDER_GITHUB_OWNER=fosschad \
            -DSHUDDER_GITHUB_REPOSITORY=Shudder

      - name: Build ASan UBSan
        run: cmake --build build-asan --parallel

      - name: Run ASan UBSan tests
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1:strict_init_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  publish:
    needs: [build-linux, sanitizers]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: shudder-linux-release
          path: release

      - name: Publish immutable Shudder release
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "release/shudder_${version}_x86_64.tar.gz"
            "release/shudder_${version}_amd64.deb"
            "release/shudder-${version}-1.x86_64.rpm"
            "release/Shudder-${version}-x86_64.AppImage"
            "release/Shudder-${version}-x86_64.AppImage.sha256"
            "release/SHA256SUMS"
            "release/release-notes.md"
          )
          for artifact in "${expected[@]}"; do
            test -s "$artifact"
          done
          (cd release && sha256sum -c SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; release assets are immutable."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --notes-file release/release-notes.md
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
